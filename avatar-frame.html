<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="normal">
  <title>Gemini Live Avatar</title>
  <style>
    :root { color-scheme: normal; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .stage {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #3c4043, #202124);
    }
    .stage img, .stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      /* Frame the face of the 9:16 portrait in the round bubble. */
      object-fit: cover;
      object-position: 50% 28%;
    }
    video { opacity: 0; transition: opacity 0.3s; }
    video.live { opacity: 1; }
  </style>
</head>
<body>
  <div class="stage">
    <img id="poster" alt="">
    <video id="video" playsinline></video>
  </div>
  <script type="module" src="avatar-frame.js"></script>
</body>
</html>
