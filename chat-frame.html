<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chat with Gemini</title>
  <style>
    :root {
      color-scheme: light dark;
      --card: #fff;
      --text: #1f1f1f;
      --muted: #5f6368;
      --border: #e3e3e3;
      --user: #e8f0fe;
      --user-text: #174ea6;
      --accent: #1a73e8;
      --note: #188038;
      --error: #d93025;
      --code: #f1f3f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #202124;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #3c4043;
        --user: #283a5c;
        --user-text: #d2e3fc;
        --accent: #8ab4f8;
        --note: #81c995;
        --error: #f28b82;
        --code: #303134;
      }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--card);
      color: var(--text);
      font: 14px/1.5 "Google Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 8px 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    header .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: conic-gradient(#4285f4, #9b72cb, #d96570, #f9ab00, #34a853, #4285f4);
    }
    header h1 { flex: 1; margin: 0; font-size: 14px; font-weight: 500; }
    .icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }
    .icon:hover { background: var(--code); }
    .icon:focus-visible { outline: 2px solid var(--accent); }
    .icon svg { width: 20px; height: 20px; fill: currentColor; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overscroll-behavior: contain;
    }
    .empty { margin: auto; padding: 0 16px; color: var(--muted); text-align: center; font-size: 13px; }
    .msg { max-width: 100%; overflow-wrap: anywhere; }
    .msg.user {
      align-self: flex-end;
      max-width: 85%;
      padding: 7px 12px;
      border-radius: 16px 16px 4px 16px;
      background: var(--user);
      color: var(--user-text);
      white-space: pre-wrap;
    }
    .msg.model > :first-child { margin-top: 0; }
    .msg.model > :last-child { margin-bottom: 0; }
    .msg.model p, .msg.model ul, .msg.model ol, .msg.model pre { margin: 0 0 8px; }
    .msg.model ul, .msg.model ol { padding-left: 20px; }
    .msg.model.partial::after {
      content: "";
      display: inline-block;
      width: 7px;
      height: 14px;
      margin-left: 2px;
      vertical-align: -2px;
      background: var(--accent);
      animation: blink 1s steps(2) infinite;
    }
    .msg.note, .msg.error { align-self: center; font-size: 12px; text-align: center; }
    .msg.note { color: var(--note); }
    .msg.error { color: var(--error); }
    code {
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--code);
      font: 12.5px/1.4 "Roboto Mono", ui-monospace, monospace;
    }
    pre { padding: 8px 10px; border-radius: 8px; background: var(--code); overflow-x: auto; }
    pre code { padding: 0; background: none; }
    a { color: var(--accent); }
    .thinking { display: flex; gap: 4px; padding: 4px 0; }
    .thinking span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .thinking span:nth-child(2) { animation-delay: 0.15s; }
    .thinking span:nth-child(3) { animation-delay: 0.3s; }
    form {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin: 0 10px 10px;
      padding: 6px 6px 6px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    form:focus-within { border-color: var(--accent); }
    textarea {
      flex: 1;
      min-height: 22px;
      max-height: 120px;
      margin: 5px 0;
      padding: 0;
      border: 0;
      outline: none;
      resize: none;
      background: none;
      color: var(--text);
      font: inherit;
    }
    #send { background: var(--accent); color: var(--card); }
    #send:hover { filter: brightness(1.08); background: var(--accent); }
    #send:disabled { opacity: 0.4; cursor: default; filter: none; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-4px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <header>
    <span class="dot" aria-hidden="true"></span>
    <h1>Chat with Gemini</h1>
    <button id="hide" class="icon" type="button" title="Hide chat (Esc)" aria-label="Hide chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13H5v-2h14v2z"/></svg>
    </button>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Ask about this page…" aria-label="Message"></textarea>
    <button id="send" class="icon" type="submit" aria-label="Send" title="Send (Enter)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="send-icon" d="M3.4 20.4 20.85 12.92a1 1 0 0 0 0-1.84L3.4 3.6a.99.99 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
    </button>
  </form>
  <script type="module" src="chat-frame.js"></script>
</body>
</html>
